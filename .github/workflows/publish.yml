name: Publish to npm

# Publishes the package to npmjs.com when a GitHub release is published
# (the repo's "ship it" flow ends with `gh release create vX.X.X`, so a
# release = a publish). Can also be run by hand from the Actions tab.
#
# Auth: npm TRUSTED PUBLISHING (OIDC) — no NPM_TOKEN secret anywhere.
# One-time setup on npmjs.com (package -> Settings -> Trusted Publisher):
#   GitHub Actions, owner: DarceyLloyd, repo: pi-aftc-toolset,
#   workflow: publish.yml (this file), environment: (leave empty).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write # required for OIDC trusted publishing + provenance
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24: trusted publishing needs npm >= 11.5.1, and the OIDC
      # handshake is broken under node 22 even with npm upgraded
      # (E404 on the publish PUT — npm/cli#8976; node 24 is the fix).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Safety: a release tag must match package.json's version, so a
      # mis-tagged release can never publish the wrong version number.
      - name: Verify tag matches package.json version
        if: github.event_name == 'release'
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          echo "package.json: $PKG_VERSION — tag: $TAG"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "::error::tag v$TAG does not match package.json $PKG_VERSION"
            exit 1
          fi

      # Publish is all that runs here: tests live outside the repo (local
      # only) and the package needs no build/install step (pi loads raw .ts).
      - name: Publish to npm
        run: npm publish --provenance --access public
